name: Gerar APK
on:
  workflow_dispatch:
    inputs:
      bot:
        description: 'Incluir o bot de teste 🤖 (desligue antes de publicar)'
        type: boolean
        default: true
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar o app (src/ -> www/)
        run: |
          sudo apt-get install -y webp
          node tools/otimizar-imagens.js
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bot }}" = "true" ]; then node tools/build.js --bot; else node tools/build.js; fi
          mkdir -p www
          cp -r dist/* www/
      - name: Preparar o Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init Kaien com.kaien.app --web-dir www
          npx cap add android
          # Ícone do Kaien (gerado de resources/icon/; os PNGs prontos ficam em resources/android/res)
          cp -r resources/android/res/. android/app/src/main/res/
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # Privacidade: os dados do app (diário, hábitos) não vão para o backup automático do Google
          sed -i 's#android:allowBackup="true"#android:allowBackup="false" android:fullBackupContent="false"#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml || echo "::warning::allowBackup não encontrado no manifesto"
          # Só HTTPS dentro do app (sem tráfego em texto puro)
          sed -i 's#<application#<application android:usesCleartextTraffic="false"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Verificar dependências (vulnerabilidades conhecidas)
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit encontrou vulnerabilidades altas. Veja o log acima."
          ! grep -rEn "(api[_-]?key|secret|password)\s*[:=]\s*['\"][A-Za-z0-9_\-]{12,}" src/ www/ || (echo "::error::Possível segredo no código" && exit 1)
      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publicar o APK para baixar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "beta-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --target "${{ github.sha }}" --title "Kaien beta ${{ github.run_number }} (${{ github.ref_name }})" --notes "APK de teste gerado da branch ${{ github.ref_name }}"
