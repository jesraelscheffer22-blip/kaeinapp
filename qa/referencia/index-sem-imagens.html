  const sp=Array.from({length:16},(_,i)=>{const a=i/16*6.283,r=90+Math.random()*60;return '<i class="spk" style="--bx:'+Math.round(Math.cos(a)*r)+'px;--by:'+Math.round(Math.sin(a)*r)+'px"></i>'}).join('');

 else if(c.st==='parcial'){h='<div class="cel"><div class="gcard"><div class="gl">Registrado</div><b>'+esc(c.title)+'</b><p class="note">'+esc(partText(c.part))+'</p><p class="note">Sem XP desta vez, mas anotei na sua evolução.</p>'+times+'</div><div class="b" style="animation:none"><p><span class="g">Kaien</span><br>Parte é mais do que nada. Amanhã a gente vê.</p></div><button class="cta" onclick="closeCel()">Continuar</button></div>'}
 else if(c.st==='rec'){h='<div class="cel"><div class="gcard"><div class="gl">Tudo bem</div><b>'+esc(c.title)+'</b><p class="note">Recaída faz parte do caminho e não tira nada de você. O andar continua aberto. Se estiver pesado, vale conversar com alguém de confiança ou com um profissional.</p>'+SUP+'</div><div class="b" style="animation:none"><p><span class="g">Kaien</span><br>Eu não vou te julgar. Respire e volte quando puder.</p></div><button class="cta" onclick="closeCel()">Continuar</button></div>'}
 else{h='<div class="cel"><div class="gcard"><div class="gl">Pare por hoje</div><b>'+esc(c.title)+'</b><p class="note">Dor é um aviso do corpo. Descanse. Se ela voltar ou continuar, procure um profissional de saúde antes de treinar de novo.</p>'+SUP+'</div><div class="b" style="animation:none"><p><span class="g">Kaien</span><br>Seu corpo vem primeiro.</p></div><button class="cta" onclick="closeCel()">Continuar</button></div>'}
 return h}
setInterval(()=>{const g=S&&S.g;if(!g||g.ph==='ask'||g.ph==='fb')return;const st=curStep(),e=elapsed(g);const gt=$('gt');if(gt)gt.textContent=fmt(e/1000);

function dgMig(){S.dgAll=S.dgAll||{};if(S.dg&&!S.dgAll[S.dg.habit]){const h=S.dg.habit;if(S.dg.max==null){S.dg.max=maxHp(h);S.dg.hp=S.dg.max}S.dgAll[h]=S.dg}}
function enterDg(h,ph,rp){dgMig();ph=ph||1;rp=rp?1:0;if(!dgGate(h))return;const E=S.dgAll[h];if(!E||E.won){if(dgActiveN()>=3){S.dgMsg='Você já tem 3 dungeons abertas. Termine uma ou desista de uma para abrir outra.';S.dgCf=null;S.top=true;render();return}if(E)dgBank(h);const mx=maxHp(h);S.dgAll[h]={start:S.day,habit:h,fl:[null,null,null,null,null],last:null,max:mx,hp:mx,ph:ph,rp:rp,nx:(S.dgNx&&S.dgNx[dgK(h,ph,rp)])||0}}S.dgCf=null;S.dg=S.dgAll[h];S.dgMsg='Dungeon aberta: '+DGH[h].m+'. Toque em Continuar quando quiser entrar.';S.dgList=1;S.dsub='d';S.top=true;render()}
const dgK=(h,ph,rp)=>h+(rp?'#r':'#')+(ph||1);
const dgMul=(D,i)=>(D.ph===2?1.5:1)*(D.rp?.5:1)*(i<(D.nx||0)?0:1);
const dgActiveN=()=>Object.values(S.dgAll||{}).filter(x=>!x.won).length;
function dgBank(h){const D=S.dgAll&&S.dgAll[h];if(D)S.xpPrev+=D.fl.reduce((a,f)=>a+(f?f.xp:0),0)}
function dgAskEnter(h,ph,rp){S.dgCf={h:h,ph:ph||1,rp:rp?1:0};S.dgMsg='';S.top=true;render()}
function dgNoEnter(){S.dgCf=null;S.top=false;render()}
function dgYesEnter(){const c=S.dgCf;if(!c)return;enterDg(c.h,c.ph,c.rp)}
function dgPause(){S.dgAsk=0;dgList()}
const dgFixed=()=>(S.pull||[]).filter(h=>DGH[h]);
const dgGate=h=>h!=='O Espelho';
const DGROT=['Procrastinação','Sono ruim','Celular e redes sociais','Jogos','Outra coisa','Apostas','Cigarro ou vape','Álcool'];
const dgPool=()=>{const fx=dgFixed();return DGROT.filter(h=>DGH[h]&&!fx.includes(h)&&(h!=='O Espelho'||myLvl()>=7))};
function dgPick(){const P=dgPool(),n=P.length;S.dgRi=S.dgRi||0;let h=null;for(let k=0;k<n;k++){const c=P[(S.dgRi+k)%n];if(!(S.dgAll&&S.dgAll[c])){h=c;S.dgRi=(S.dgRi+k)%n;break}}S.dgRot={day:S.day,h:h}}
function dgRotUpd(){if(!S.dgRot||S.dgRot.day!==S.day)dgPick()}
function dgVis(){dgRotUpd();const a=[];const add=h=>{if(h&&DGH[h]&&a.indexOf(h)<0&&dgGate(h))a.push(h)};dgFixed().forEach(add);Object.keys(S.dgAll||{}).forEach(add);add(S.dgRot&&S.dgRot.h);return a}
function dgOpen(h){S.dg=S.dgAll[h];S.dgList=0;S.dgMsg='';if(!(S.bossSeen&&S.bossSeen[h]))biStart(h);S.top=true;render()}
function dgList(){S.dgList=1;S.top=true;render()}
function dgBack(){S.dgList=0;S.top=true;render()}
function dgExit(){S.dgAsk=1;S.top=false;render()}
function dgCancel(){S.dgAsk=0;S.top=false;render()}
function dgLeave(){const D=S.dg,h=D.habit;S.xpPrev+=D.fl.reduce((a,f)=>a+(f?f.xp:0),0);const c=D.fl.filter(Boolean).length;S.dgHist.push({cleared:c,left:1});S.dgNx=S.dgNx||{};const k=dgK(h,D.ph,D.rp),nx=Math.max(S.dgNx[k]||0,c,D.nx||0);S.dgNx[k]=nx;delete S.dgAll[h];S.dg=null;S.dgAsk=0;S.dgList=0;S.dgMsg='Você desistiu de '+DGH[h].m+'. O XP ganho ficou salvo.'+(nx?' Se voltar a ele, o monstro começa com a vida cheia e os andares até o '+nx+'º não darão XP.':' Se voltar a ele, o monstro começa com a vida cheia.');S.top=true;render()}
function gRec(){completeMission('rec',null)}

const REW={2:{n:'Título: Aprendiz'},3:{n:'Capítulo 1 do mestre Kaien: a noite no pátio',m:1},4:{n:'Aura cinza do personagem e capítulo 2 do diário'},5:{n:'Nova roupa do personagem',m:1},6:{n:'Título: Constante'},7:{n:'Chefe: O Espelho'},8:{n:'Novo fundo: Templo das Cachoeiras',m:1},9:{n:'Capítulo 3 do diário'},10:{n:'Roupa nova do rank D e o título Aspirante',m:1},16:{n:'Novo fundo: Templo dos Dragões',m:1}};
const titlesOf=L=>{const a=[];if(L>=2)a.push('Aprendiz');if(L>=6)a.push('Constante');if(L>=10)a.push('Aspirante');Object.keys(S.defeated||{}).forEach(h=>a.push('Derrotou o '+DGH[h].m));return a};
const XPC=[250,300,400,550,600,650,700,800,900,1000];
const costOf=L=>L<=10?XPC[L-1]:1000+100*(L-10);
const cum=L=>{let s=0;for(let i=1;i<L;i++)s+=costOf(i);return s};
const lvlRaw=x=>{let L=1;while(x>=cum(L+1))L++;return L};
const lvlOf=x=>{const L=lvlRaw(x);return(L>=10&&S.provaD!==1)?9:L};
const xpInOf=x=>{const L=lvlOf(x);return Math.min(costOf(L),x-cum(L))};
const myLvl=()=>lvlOf(totalXp());
const DIC=[[4,'Capítulo 2 · A primeira recusa','Quando eu era novo, recusei ajuda porque achava que pedir era fraqueza. Perdi anos assim. Quando você precisar pedir ajuda, saiba que eu entendo o tamanho desse passo.'],[9,'Capítulo 3 · O que me manteve','Não foi força. Foi voltar. Toda vez que eu caía, eu voltava no dia seguinte. Só isso. É o mesmo que você tem feito.']];

const TR=[[0,'Desconhecido'],[8,'Observado'],[18,'Tolerado'],[30,'Aceito'],[42,'Respeitado'],[55,'Aliado'],[68,'Confiável'],[80,'Irmão de caminho'],[92,'Herdeiro'],[100,'Mestre']];
const DI=[[0, "Eu também comecei sem saber se aguentaria. O difícil nunca foi o treino."], [0, "Onde eu cresci, dizem que quem aparece todo dia já venceu metade da luta."], [6, "Hoje é dia de aprender, não de provar nada."], [8, "Houve um tempo em que eu largava tudo na primeira semana. Guarde isso, sem rir."], [10, "Percebi que você escreve. Quem escreve pensa. Quem pensa muda."], [12, "Meu mestre nunca me elogiou, só me corrigia. Eu escolho fazer diferente com você."], [14, "Eu ainda não disse, mas gosto de ver você chegar."], [16, "Quando eu era novo, achava que força era não sentir. Estava enganado."], [18, "Percebi que você volta mesmo nos dias ruins. Isso me interessa."], [22, "Você já passou da fase em que quase todos desistem. Não fale isso alto, dá azar."], [24, "Meu mestre gostava de chá. Eu detestava. Hoje bebo todas as manhãs."], [28, "Tem dias em que eu também não quero. Eu levanto do mesmo jeito."], [30, "Eu confiava pouco nas pessoas. Você está mudando isso, devagar."], [32, "Cuide do sono. Eu demorei anos para entender isso."], [36, "Você não precisa ser perfeito. Precisa ser fiel."], [38, "Eu comecei a contar com você. Isso é novo para mim."], [42, "Às vezes olho para o pátio e lembro do primeiro dia. Você me lembra dele."], [46, "Já vi muitos alunos. Poucos chegam onde você está sem perceber."], [50, "Não existe atalho. Existe caminho, e você está nele."], [54, "A cada dia que você volta, a minha dúvida sobre você diminui."], [58, "Se um dia precisar parar, pare. Eu estarei aqui quando voltar."], [62, "Falei de você hoje a alguém. Disse que você é sério."], [66, "Você já ensina sem saber. Sua constância mostra o caminho a quem vê."], [70, "Pode me chamar de treinador. Mas já considero você parte do caminho."], [74, "Lembre de onde saiu. Não é para se sentir pequeno. É para ver o quanto andou."], [78, "Meu mestre nunca me disse isso. Eu digo a você: estou orgulhoso."], [82, "Quando chegar ao topo, não pare de olhar para trás. Tem gente começando."], [86, "Você já não é só meu aprendiz. É meu companheiro de caminho."], [90, "A pressa nunca foi nossa. Falta pouco, e a gente chega do nosso jeito."], [94, "Aprendi mais com você do que imagina."], [97, "Obrigado por voltar todos os dias."], [100, "Mestre. Ainda não, mas a palavra já combina com você."]];
const HIS=[{id:"noite",t:"A noite no pátio",ic:"🏮",c:"255,150,70",d:"Como tudo começou.",ch:[[3,"A noite no pátio",SCENE],[4,"A primeira recusa",DIC[0][2]],[9,"O que me manteve",DIC[1][2]],[14,"Amanhecer","Houve uma manhã em que acordei sem o peso no peito. Não foi mágica. Foram semanas de dias pequenos somados. Eu só percebi quando já tinha passado. É assim que acontece, e vai acontecer com você também."]]},{id:"mestre",t:"O mestre",ic:"🥋",c:"150,170,255",d:"Quem me ensinou.",ch:[[6,"O homem que não elogiava","Meu mestre falava pouco e elogiava menos ainda. Durante um ano, só ouvi \"de novo\". Eu achava que ele não gostava de mim. Hoje sei que \"de novo\" era o jeito dele de dizer que eu merecia a chance de melhorar."],[12,"A regra do mestre","Ele tinha uma única regra: nunca treine com raiva. \"A raiva cansa antes do corpo\", dizia. Quando eu estava furioso, ele me mandava sentar e respirar até a raiva baixar. Odiei isso por meses. Depois aprendi a me mandar sentar sozinho."],[22,"O dia em que ele errou","Uma vez meu mestre errou na frente de todos e pediu desculpas. Eu nunca tinha visto isso. Entendi que ensinar não é nunca falhar. É mostrar o que fazer depois que se falha. Foi a melhor aula dele."],[35,"O que ele deixou","Quando ficou velho, ele não me deixou arma nem título. Deixou um hábito: levantar antes do sol e agradecer pelo dia. Hoje eu faço o mesmo, e é por isso que estou aqui esperando você todas as manhãs."]]},{id:"porque",t:"Por que eu treino",ic:"🌱",c:"110,210,150",d:"O que me move.",ch:[[8,"A vila","Eu cresci numa vila pequena, onde ninguém falava de sentimentos. Quem estava mal ficava quieto, e o silêncio virava peso. Treinar foi o primeiro lugar onde eu pude gastar esse peso sem precisar explicar."],[16,"O que eu perdi","Perdi alguém importante antes de estar pronto. Não vou dizer quem. Naquele inverno, o treino foi a única coisa que me manteve de pé. Não curou nada, mas me deu um horário e um motivo para levantar."],[26,"A promessa","Prometi a mim mesmo que, se eu saísse daquele inverno, ajudaria alguém a sair do seu. Por isso eu ensino. Não é caridade. É a promessa que fiz quando não tinha mais nada."],[38,"O que eu protejo","Hoje eu protejo uma coisa simples: o direito de qualquer pessoa recomeçar. Não importa de onde veio nem quantas vezes caiu. Se a pessoa aparece, eu estou aqui. Foi isso que meu mestre fez comigo."]]},{id:"fracasso",t:"O primeiro fracasso",ic:"🌑",c:"170,140,230",d:"O dia em que eu desisti.",ch:[[10,"Largar tudo","No terceiro mês, larguei tudo. Disse a mim mesmo que não nasci para aquilo. Passei duas semanas na cama, evitando olhar para o pátio. Eu achava que desistir seria um alívio. Foi o contrário."],[18,"O vazio","O vazio de quem desistiu é pior que o cansaço de quem tenta. Eu fingia estar bem. Meu mestre nunca me procurou. Só deixou a porta aberta e a tocha acesa no pátio, todas as noites."],[28,"Voltar","Voltei sem dizer nada e sentei no pátio. Meu mestre passou, viu e seguiu em frente, como se eu nunca tivesse saído. Esse silêncio foi o maior gesto de respeito que já recebi. Ninguém me cobrou. Eu me cobrei, e dessa vez do jeito certo."],[40,"A cicatriz","Hoje vejo aquele fracasso como uma cicatriz, não como uma ferida. Ela lembra por onde passei. Se você falhar, e vai falhar, lembre que cicatriz só fica em quem sobreviveu."]]},{id:"companheiros",t:"Os companheiros",ic:"🤝",c:"240,190,90",d:"Quem treinou comigo.",ch:[[13,"Ren","Ren treinava ao meu lado. Era mais rápido, mais forte e mais confiante que eu, e eu o invejava. Só muito depois percebi que ele também invejava a minha paciência. Cada um via no outro o que lhe faltava."],[21,"Tobi","Tobi nunca ganhava de ninguém, mas nunca faltou a um treino. Todos riam dele no começo. Cinco anos depois, ninguém ria. Constância vence talento quando o talento descansa."],[31,"Cada um no seu caminho","Com o tempo, cada um tomou um rumo. Ren foi para longe, Tobi abriu o próprio pátio, eu fiquei. Não houve despedida dramática. Pessoas boas se separam como quem cruza uma ponte: com um aceno e a certeza de que a ponte continua lá."],[43,"O reencontro","Anos depois, os dois voltaram no mesmo dia, sem combinar. Sentamos no pátio e ninguém falou por um bom tempo. Não precisava. Quem treinou junto sabe o que o outro carrega."]]},{id:"espelho",t:"A origem do Espelho",ic:"🪞",c:"150,190,255",d:"De onde vêm os monstros.",ch:[[11,"O primeiro reflexo","O Espelho não nasceu monstro. Era um espelho velho no fundo do pátio. Um dia olhei nele e não gostei de quem vi. Eu ainda não sabia que ele só mostrava o que eu já carregava."],[24,"Os monstros têm nome","Percebi que o que me assombrava tinha formas diferentes: a fumaça, a garrafa, o celular, o jogo. Quando dei um nome a cada um, deixaram de ser névoa e viraram coisas que dá para enfrentar, uma de cada vez."],[34,"O que o Espelho mostra","O Espelho não mente, mas também não é cruel. Ele mostra quem você é agora, não quem vai ser. Quem foge dele fica parado. Quem o encara todo dia começa a mudar o reflexo."],[45,"Quebrar o Espelho","Um dia, o Espelho rachou. Não foi uma vitória dramática. Foi uma manhã comum em que olhei e vi alguém que eu respeitava. Não precisei quebrar nada. Só parei de precisar dele."]]},{id:"medo",t:"O medo dele",ic:"🕯️",c:"200,120,160",d:"O que ele nunca contou.",ch:[[20,"O que eu não conto","Tenho um medo que nunca contei a ninguém: o de ensinar errado e fazer alguém desistir por minha causa. Cada aluno novo é um peso. Guardei isso comigo, mas hoje contei a você. Isso diz alguma coisa."],[30,"A noite sem tocha","Uma noite a tocha do pátio apagou e eu fiquei sozinho no escuro. Em vez de pânico, senti calma. Entendi que o medo não some, mas encolhe quando a gente fica com ele sem fugir."],[41,"Dizer em voz alta","O medo cresce no silêncio. Quando eu disse em voz alta o que me assustava, ele ficou pequeno. Por isso peço que você escreva nas missões. Escrever é dizer em voz alta para dentro."],[47,"Com medo, e ir","Coragem nunca foi não ter medo. É ir mesmo assim, com ele ao lado. Eu vou até o fim com o meu. Você também vai, e vai chegar mais longe do que imagina."]]},{id:"caminho",t:"O caminho até o rank S",ic:"🏔️",c:"255,215,120",d:"O que existe lá no alto.",ch:[[15,"O que é um rank","Rank não é título. É um retrato do seu hábito. Cada rank pede mais constância, não mais pressa. Quem sobe não ficou forte da noite para o dia. Ficou fiel por mais tempo."],[27,"A zona do meio","Entre o rank C e o B, quase todos desistem. Não há mais novidade e o fim ainda parece longe. É a zona do meio. Quem atravessa descobre que a disciplina deixou de ser esforço e virou parte de quem é."],[39,"O topo não é um lugar","Pensei por anos que o rank S era um lugar onde se chega e descansa. Não é. É um jeito de viver que já está no caminho. Quando você chegar lá, vai perceber que já vivia assim."],[50,"Rank S","Você chegou. Não foi sorte nem talento: foi voltar, dia após dia. Eu tenho orgulho de você, e agora você pode ensinar o que aprendeu. O caminho continua, mas agora você sabe andar nele."]]}];

function frmClose(){S.mv=0;S.top=true;render()}
function frmEq(id){const f=FRM.find(x=>x.id===id);if(!f||!f.ok())return;S.eq.mold=S.eq.mold===id?'':id;render()}
function frmView(){return '<div class="gh"><button class="lk" onclick="frmClose()">‹ Voltar</button><span class="note">Molduras</span></div>'+FRM.map(f=>{const ok=f.ok(),on=S.eq.mold===f.id;return '<div class="card" style="'+(ok?'':'opacity:.55')+'"><div class="mt"><span class="g">'+(ok?(on?'Equipada':'Liberada'):'Bloqueada')+'</span><b>'+esc(f.n)+'</b></div><div '+fwAttr(f).replace('class="fw','class="fw fpv')+'><span class="fn">'+myLvl()+'</span><div class="card" style="margin:0;text-align:center"><b>'+esc(S.name)+'</b></div></div><p class="note">'+esc(f.d)+'</p>'+(ok?'<button class="mb '+(on?'on':'')+'" onclick="frmEq(\''+f.id+'\')">'+(on?'Equipada (tocar para tirar)':'Equipar')+'</button>':'')+'</div>'}).join('')}

function eqTog(k){const need={aura:4,pose:5,bg:6,frame:8,tone:5}[k];if(myLvl()<need)return;S.eq[k]=S.eq[k]?0:1;S.top=false;render()}
